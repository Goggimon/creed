<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREED // 3D Holographic Neural Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
      color: #e6d3b3;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #overlay-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .hub-line {
      stroke: rgba(255, 168, 40, 0.24);
      stroke-width: 1;
      fill: none;
      transition: stroke 0.2s ease;
    }
    .hub-line.active {
      stroke: rgba(255, 200, 80, 0.78);
      stroke-width: 1.5;
    }
    .node-card {
      position: fixed;
      width: 146px;
      padding: 8px 12px;
      background: rgba(12, 11, 10, 0.88);
      border: 1px solid rgba(255, 168, 40, 0.28);
      border-radius: 6px;
      cursor: pointer;
      z-index: 10;
      transform: translate(-50%, -50%);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .node-card:hover {
      border-color: rgba(255, 210, 90, 0.85);
      background: rgba(28, 21, 13, 0.94);
    }
    .node-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      color: #f5e6c8;
    }
    .node-sub {
      font-family: "SF Mono", "IBM Plex Mono", monospace;
      font-size: 9px;
      color: #c99846;
      margin-top: 2px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <svg id="overlay-svg"></svg>
  <div id="nodes-layer"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // =========================================================================
    // 1. CONNECTED MODULE NODES AROUND THE HOLOGRAPHIC SPHERE
    // =========================================================================
    const MODULE_NODES = [
      { key: "CONVERSATION", title: "CONVERSATION", sub: "Chat • Stream", tab: 1, angle: -90 },
      { key: "SYSTEMS",      title: "SYSTEMS",      sub: "Mac • BT • ADB", tab: 3, angle: -32 },
      { key: "TOOLS",        title: "TOOLS",        sub: "Execute • API", tab: 4, angle: 22 },
      { key: "SETTINGS",     title: "SETTINGS",     sub: "Config • Env",  tab: 7, angle: 68 },
      { key: "AUTOMATION",   title: "AUTOMATION",   sub: "Workflows",     tab: 6, angle: 122 },
      { key: "VOICE",        title: "VOICE",        sub: "STT • TTS",     tab: 5, angle: 178 },
      { key: "MEMORY",       title: "MEMORY",       sub: "SQLite • Chats",tab: 2, angle: -145 },
    ];

    const overlaySvg = document.getElementById("overlay-svg");
    const nodesLayer = document.getElementById("nodes-layer");
    const nodeElements = [];

    function buildModuleNodes() {
      overlaySvg.innerHTML = "";
      nodesLayer.innerHTML = "";
      nodeElements.length = 0;

      MODULE_NODES.forEach((n) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "hub-line");
        overlaySvg.appendChild(path);

        const card = document.createElement("div");
        card.className = "node-card";
        card.innerHTML = `<div class="node-title">${n.title}</div><div class="node-sub">● ${n.sub}</div>`;
        card.addEventListener("mouseenter", () => path.classList.add("active"));
        card.addEventListener("mouseleave", () => path.classList.remove("active"));
        card.addEventListener("click", () => {
          document.title = `CREED_TAB:${n.tab}:${Date.now()}`;
        });
        nodesLayer.appendChild(card);
        nodeElements.push({ spec: n, card, path });
      });
    }

    function layoutModuleNodes() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = w / 2;
      const cy = h / 2;
      const rx = Math.min(w * 0.38, 340);
      const ry = Math.min(h * 0.38, 225);
      const innerR = Math.min(w, h) * 0.21;

      nodeElements.forEach(({ spec, card, path }) => {
        const rad = (spec.angle * Math.PI) / 180;
        const nx = cx + Math.cos(rad) * rx;
        const ny = cy + Math.sin(rad) * ry;
        card.style.left = `${nx}px`;
        card.style.top = `${ny}px`;

        const sx = cx + Math.cos(rad) * innerR;
        const sy = cy + Math.sin(rad) * innerR;
        const mx = sx + (nx - sx) * 0.45;
        path.setAttribute("d", `M ${sx} ${sy} L ${mx} ${sy} L ${mx} ${ny} L ${nx} ${ny}`);
      });
    }

    buildModuleNodes();
    layoutModuleNodes();

    // =========================================================================
    // 2. FAST SINGLE-PASS RENDERER (NO MULTI-PASS BLOOM OVERHEAD IN WEBENGINE)
    // =========================================================================
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050608);
    scene.fog = new THREE.FogExp2(0x050608, 0.042);

    const camera = new THREE.PerspectiveCamera(
      44,
      window.innerWidth / window.innerHeight,
      0.1,
      80
    );
    camera.position.set(0, 0.4, 10.8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      alpha: false,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.minDistance = 6.5;
    controls.maxDistance = 16.0;

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // =========================================================================
    // 3. CENTRAL CORE: ADDITIVE GLOW HALO + ENERGY RING + CREED SVG LOGO
    // =========================================================================
    // Soft radial amber glow sprite (replaces expensive full-screen BloomPass)
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = 128;
    glowCanvas.height = 128;
    const gctx = glowCanvas.getContext("2d");
    const grad = gctx.createRadialGradient(64, 64, 4, 64, 64, 64);
    grad.addColorAt = undefined;
    grad.addColorStop(0.0, "rgba(255, 195, 80, 0.36)");
    grad.addColorStop(0.35, "rgba(230, 130, 20, 0.14)");
    grad.addColorStop(1.0, "rgba(0, 0, 0, 0)");
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, 128, 128);

    const glowSprite = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })
    );
    glowSprite.scale.set(3.2, 3.2, 1);
    scene.add(glowSprite);

    const coreRing = new THREE.Mesh(
      new THREE.RingGeometry(0.62, 0.67, 64),
      new THREE.MeshBasicMaterial({
        color: 0xd9922b,
        transparent: true,
        opacity: 0.62,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })
    );
    scene.add(coreRing);

    const creedSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFE6A3"/>
            <stop offset="55%" stop-color="#E6A832"/>
            <stop offset="100%" stop-color="#B85600"/>
          </linearGradient>
        </defs>
        <g fill="url(#g)" stroke="#FFD580" stroke-width="2" stroke-linejoin="miter">
          <polygon points="128,22 148,58 138,214 128,232 118,214 108,58"/>
          <polygon points="98,64 50,38 78,104 108,192 112,138"/>
          <polygon points="158,64 206,38 178,104 148,192 144,138"/>
          <polygon points="24,26 76,78 96,158 56,98"/>
          <polygon points="232,26 180,78 160,158 200,98"/>
        </g>
      </svg>
    `.trim();
    const svgUrl = URL.createObjectURL(new Blob([creedSvg], { type: "image/svg+xml;charset=utf-8" }));
    const logoTexture = new THREE.TextureLoader().load(svgUrl);
    logoTexture.colorSpace = THREE.SRGBColorSpace;

    const logoMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(0.86, 0.86),
      new THREE.MeshBasicMaterial({
        map: logoTexture,
        transparent: true,
        opacity: 0.92,
        depthTest: false,
        depthWrite: false,
        side: THREE.DoubleSide,
      })
    );
    logoMesh.renderOrder = 15;
    scene.add(logoMesh);

    // =========================================================================
    // 4. CONCENTRIC ORBITAL RINGS (LIGHTWEIGHT TORUS GEOMETRY)
    // =========================================================================
    const rings = [];
    const ringConfigs = [
      { r: 1.28, tube: 0.009, tiltX: 0.55, tiltY: 0.25, speedX: 0.22, speedY: 0.36, speedZ: 0.14, color: 0xd9a043 },
      { r: 1.62, tube: 0.008, tiltX: -0.78, tiltY: 0.62, speedX: -0.30, speedY: 0.20, speedZ: 0.26, color: 0xc9842b },
      { r: 1.94, tube: 0.010, tiltX: 1.15, tiltY: -0.45, speedX: 0.16, speedY: -0.40, speedZ: 0.20, color: 0xe3b964 },
      { r: 2.26, tube: 0.007, tiltX: -0.32, tiltY: -1.05, speedX: -0.24, speedY: -0.18, speedZ: -0.32, color: 0xb86b16 },
      { r: 2.55, tube: 0.008, tiltX: 0.92, tiltY: 0.88, speedX: 0.12, speedY: 0.28, speedZ: -0.22, color: 0xd99e3d },
    ];

    ringConfigs.forEach((cfg) => {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(cfg.r, cfg.tube, 5, 72),
        new THREE.MeshBasicMaterial({
          color: cfg.color,
          wireframe: true,
          transparent: true,
          opacity: 0.32,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      mesh.rotation.set(cfg.tiltX, cfg.tiltY, 0);
      globeGroup.add(mesh);
      rings.push({ mesh, cfg });
    });

    // =========================================================================
    // 5. OUTER NEURAL SPHERE: INSTANCED NODES + CIRCUIT SPLINES + RADIAL BEAMS
    // =========================================================================
    const NODE_COUNT = 48;
    const SHELL_RADIUS = 2.65;
    const nodePositions = [];
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));

    for (let i = 0; i < NODE_COUNT; i++) {
      const y = 1 - (i / (NODE_COUNT - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const theta = goldenAngle * i;
      nodePositions.push(
        new THREE.Vector3(
          Math.cos(theta) * r * SHELL_RADIUS,
          y * SHELL_RADIUS,
          Math.sin(theta) * r * SHELL_RADIUS
        )
      );
    }

    const instancedNodes = new THREE.InstancedMesh(
      new THREE.OctahedronGeometry(0.038, 0),
      new THREE.MeshBasicMaterial({
        color: 0xf2d18a,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      }),
      NODE_COUNT
    );
    const dummy = new THREE.Object3D();
    nodePositions.forEach((p, i) => {
      dummy.position.copy(p);
      dummy.updateMatrix();
      instancedNodes.setMatrixAt(i, dummy.matrix);
    });
    instancedNodes.instanceMatrix.needsUpdate = true;
    globeGroup.add(instancedNodes);

    const circuitPoints = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      for (let j = i + 1; j < NODE_COUNT; j++) {
        if (nodePositions[i].distanceTo(nodePositions[j]) < 1.38) {
          const a = nodePositions[i];
          const b = nodePositions[j];
          const mid = a.clone().lerp(b, 0.5).normalize().multiplyScalar(SHELL_RADIUS + ((i + j) % 2 === 0 ? 0.1 : -0.07));
          circuitPoints.push(a.x, a.y, a.z, mid.x, mid.y, mid.z);
          circuitPoints.push(mid.x, mid.y, mid.z, b.x, b.y, b.z);
        }
      }
    }
    const circuitGeo = new THREE.BufferGeometry();
    circuitGeo.setAttribute("position", new THREE.Float32BufferAttribute(circuitPoints, 3));
    globeGroup.add(
      new THREE.LineSegments(
        circuitGeo,
        new THREE.LineBasicMaterial({
          color: 0xd99e3d,
          transparent: true,
          opacity: 0.16,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      )
    );

    const radialPositions = [];
    const radialSeeds = [];
    nodePositions.forEach((p, idx) => {
      const inner = p.clone().normalize().multiplyScalar(0.78);
      radialPositions.push(p.x, p.y, p.z, inner.x, inner.y, inner.z);
      radialSeeds.push(idx / NODE_COUNT, idx / NODE_COUNT);
    });
    const radialGeo = new THREE.BufferGeometry();
    radialGeo.setAttribute("position", new THREE.Float32BufferAttribute(radialPositions, 3));
    radialGeo.setAttribute("aSeed", new THREE.Float32BufferAttribute(radialSeeds, 1));

    const radialUniforms = {
      uTime: { value: 0 },
      uPulseSpeed: { value: 0.35 },
      uPulseIntensity: { value: 0.15 },
      uAudioAmp: { value: 0.0 },
    };

    const radialMat = new THREE.ShaderMaterial({
      uniforms: radialUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aSeed;
        uniform float uTime;
        uniform float uAudioAmp;
        varying float vSeed;
        varying float vDist;
        void main() {
          vSeed = aSeed;
          float r = length(position);
          vDist = clamp((r - 0.78) / 1.9, 0.0, 1.0);
          vec3 displaced = position * (1.0 + uAudioAmp * 0.11 * sin(uTime * 5.0 + aSeed * 20.0));
          gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uPulseSpeed;
        uniform float uPulseIntensity;
        varying float vSeed;
        varying float vDist;
        void main() {
          float wave = fract(vDist + uTime * uPulseSpeed + vSeed);
          float pulse = smoothstep(0.84, 1.0, wave) * uPulseIntensity;
          float baseAlpha = 0.05 + pulse * 0.7;
          vec3 baseCol = mix(vec3(0.85, 0.55, 0.15), vec3(1.0, 0.90, 0.68), pulse);
          gl_FragColor = vec4(baseCol, baseAlpha);
        }
      `,
    });
    globeGroup.add(new THREE.LineSegments(radialGeo, radialMat));

    // =========================================================================
    // 6. OUTER BOKEH / ENERGY PARTICLES
    // =========================================================================
    const PARTICLE_COUNT = 220;
    const pPositions = new Float32Array(PARTICLE_COUNT * 3);
    const pRandoms = new Float32Array(PARTICLE_COUNT);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const r = 1.1 + Math.random() * 2.8;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      pPositions[i * 3 + 2] = r * Math.cos(phi);
      pRandoms[i] = Math.random();
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
    particleGeo.setAttribute("aRand", new THREE.BufferAttribute(pRandoms, 1));

    const particleUniforms = {
      uTime: { value: 0 },
      uTurbulence: { value: 0.04 },
      uAudioAmp: { value: 0.0 },
      uBrightness: { value: 0.5 },
    };

    const particleMat = new THREE.ShaderMaterial({
      uniforms: particleUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aRand;
        uniform float uTime;
        uniform float uTurbulence;
        uniform float uAudioAmp;
        varying float vAlpha;
        void main() {
          vec3 pos = position;
          float t = uTime * (0.5 + aRand * 1.1);
          pos.x += sin(t + pos.y * 2.0) * uTurbulence;
          pos.y += cos(t * 0.9 + pos.z * 2.0) * uTurbulence;
          pos.z += sin(t * 1.1 + pos.x * 2.0) * uTurbulence;
          pos *= (1.0 + uAudioAmp * 0.12);

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          float dist = -mvPos.z;
          gl_PointSize = clamp((18.0 / max(dist, 1.0)) * (0.65 + aRand * 1.1), 1.2, 9.0);
          vAlpha = smoothstep(16.0, 5.0, dist) * (0.3 + 0.6 * aRand);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform float uBrightness;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float soft = pow(1.0 - d * 2.0, 1.8);
          vec3 col = vec3(0.95, 0.80, 0.48);
          gl_FragColor = vec4(col, soft * vAlpha * uBrightness);
        }
      `,
    });
    globeGroup.add(new THREE.Points(particleGeo, particleMat));

    // =========================================================================
    // 7. STATE SYNC VIA CREED WEBSOCKET
    // =========================================================================
    let currentState = "idle";
    try {
      const ws = new WebSocket("ws://localhost:8000/ws");
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "status") {
            const s = (msg.state || "").toLowerCase();
            if (s === "listening" || s === "recording") currentState = "listening";
            else if (s === "processing" || s === "speaking") currentState = "processing";
            else currentState = "idle";
          } else if (msg.type === "node_pulse") {
            const nodeKey = (msg.node || "").toUpperCase();
            nodeElements.forEach(({ spec, path }) => {
              if (spec.key === nodeKey) {
                path.classList.add("active");
                setTimeout(() => path.classList.remove("active"), 1200);
              }
            });
          }
        } catch (_) {}
      };
    } catch (_) {}

    // =========================================================================
    // 8. SMOOTH ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    let smoothSpeed = 0.42;
    let smoothPulseSpeed = 0.32;
    let smoothPulseIntensity = 0.14;
    let smoothTurbulence = 0.04;
    let smoothAudio = 0.0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      const rawAudio =
        currentState === "listening"
          ? 0.25 + 0.22 * Math.sin(elapsed * 7.5) * Math.sin(elapsed * 2.3)
          : 0.0;
      smoothAudio = THREE.MathUtils.lerp(smoothAudio, rawAudio, 0.16);

      let targetSpeed = 0.42;
      let targetPulseSpeed = 0.32;
      let targetPulseIntensity = 0.14;
      let targetTurbulence = 0.04;
      let coreScale = 1.0 + 0.02 * Math.sin(elapsed * 2.0);
      let glowSize = 3.1;

      if (currentState === "listening") {
        targetSpeed = 0.95 + smoothAudio * 1.1;
        targetPulseSpeed = 0.75 + smoothAudio * 0.9;
        targetPulseIntensity = 0.38 + smoothAudio * 0.45;
        targetTurbulence = 0.09 + smoothAudio * 0.14;
        coreScale = 1.0 + smoothAudio * 0.11;
        glowSize = 3.5 + smoothAudio * 0.8;
      } else if (currentState === "processing") {
        targetSpeed = 2.6;
        targetPulseSpeed = 2.0;
        targetPulseIntensity = 0.85;
        targetTurbulence = 0.16;
        coreScale = 1.02 + 0.03 * Math.sin(elapsed * 8.0);
        glowSize = 4.0;
      }

      smoothSpeed = THREE.MathUtils.lerp(smoothSpeed, targetSpeed, 0.08);
      smoothPulseSpeed = THREE.MathUtils.lerp(smoothPulseSpeed, targetPulseSpeed, 0.08);
      smoothPulseIntensity = THREE.MathUtils.lerp(smoothPulseIntensity, targetPulseIntensity, 0.08);
      smoothTurbulence = THREE.MathUtils.lerp(smoothTurbulence, targetTurbulence, 0.08);

      globeGroup.rotation.y += dt * 0.12 * smoothSpeed;
      globeGroup.rotation.x = Math.sin(elapsed * 0.25) * 0.08;

      rings.forEach((item, idx) => {
        item.mesh.rotation.x += dt * item.cfg.speedX * smoothSpeed;
        item.mesh.rotation.y += dt * item.cfg.speedY * smoothSpeed;
        item.mesh.rotation.z += dt * item.cfg.speedZ * smoothSpeed;
        const expand = 1.0 + smoothAudio * (0.05 + idx * 0.018);
        item.mesh.scale.setScalar(THREE.MathUtils.lerp(item.mesh.scale.x, expand, 0.16));
      });

      coreRing.quaternion.copy(camera.quaternion);
      logoMesh.quaternion.copy(camera.quaternion);

      const floatY = Math.sin(elapsed * 1.7) * 0.03;
      coreRing.position.y = floatY;
      logoMesh.position.y = floatY;
      glowSprite.position.y = floatY;

      coreRing.scale.setScalar(coreScale);
      logoMesh.scale.setScalar(coreScale);
      glowSprite.scale.set(glowSize, glowSize, 1);

      radialUniforms.uTime.value = elapsed;
      radialUniforms.uPulseSpeed.value = smoothPulseSpeed;
      radialUniforms.uPulseIntensity.value = smoothPulseIntensity;
      radialUniforms.uAudioAmp.value = smoothAudio;

      particleUniforms.uTime.value = elapsed;
      particleUniforms.uTurbulence.value = smoothTurbulence;
      particleUniforms.uAudioAmp.value = smoothAudio;
      particleUniforms.uBrightness.value = currentState === "processing" ? 0.72 : 0.48 + smoothAudio * 0.22;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      layoutModuleNodes();
    });

    animate();
  </script>
</body>
</html>
