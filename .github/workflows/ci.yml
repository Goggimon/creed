name: CREED Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax & bytecode check
        run: |
          python3 -m compileall -q core intelligence modules monitoring api config utils tests

      - name: Run unit, reliability & architecture conformance tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Optional lint & type check (if dev tools installed)
        run: |
          python3 -m pip install --quiet ruff mypy || true
          if command -v ruff >/dev/null 2>&1; then ruff check intelligence monitoring config utils tests; fi
          if command -v mypy >/dev/null 2>&1; then mypy intelligence monitoring config; fi
