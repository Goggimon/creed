[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creed"
version = "3.5.0"
description = "Local-first modular AI assistant and macOS system agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "PySide6>=6.6.0",
    "faster-whisper>=1.0.0",
    "pvporcupine>=3.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "config*",
    "core*",
    "gui*",
    "infrastructure*",
    "intelligence*",
    "modules*",
    "monitoring*",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["__pycache__", ".venv", "logs", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^tests/", "^gui/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
